name: Release

# Publishes to the Visual Studio Marketplace and Open VSX when a version tag is pushed,
# for example `git tag v0.1.0 && git push origin v0.1.0`. The tag must match package.json.
# Repository secrets: VSCE_PAT (Marketplace publisher token) and OVSX_PAT (Open VSX token).
# A registry whose secret is not set is skipped, so a tag never fails on a missing token.
# Each token reaches only its own publish step; install, test and package run without them.
# Note: Azure DevOps stops accepting all-organization PATs on 2026-12-01; switch the
# Marketplace step to `vsce publish --azure-credential` (Microsoft Entra workload identity)
# before then. Until a token exists, upload the .vsix artifact at
# https://marketplace.visualstudio.com/manage/publishers/empiriolabs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Whether each token is set, never the token itself.
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package --out empiriolabs-vscode-chat.vsix

      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.HAS_VSCE_PAT == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath empiriolabs-vscode-chat.vsix --skip-duplicate

      - name: Publish to Open VSX
        if: ${{ env.HAS_OVSX_PAT == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish empiriolabs-vscode-chat.vsix --skip-duplicate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: empiriolabs-vscode-chat-vsix
          path: empiriolabs-vscode-chat.vsix
