name: Release

# Publishes to the Visual Studio Marketplace and Open VSX when a version tag is pushed,
# for example `git tag v0.1.0 && git push origin v0.1.0`. The tag must match package.json.
#
# Three jobs, so nothing is installed in the job that can publish: `build` installs, tests
# and packages with a read-only token and no secret, and uploads the .vsix; `publishers`
# installs only the two registry publishers from publishers/package-lock.json (exact
# versions and integrity hashes, no install scripts), also without a secret, and uploads
# them; `publish` runs in the `release` environment (v* tags only, approved by a
# maintainer), installs nothing, and runs those publishers on that .vsix.
#
# Open VSX: trusted publishing (OIDC). The registry trusts EmpirioLabs-AI/vscode-empiriolabs,
# this workflow and the `release` environment, so the publish job asks GitHub for an ID token
# (`id-token: write`) and `ovsx publish --trusted-publishing` exchanges it for a short-lived
# token. No Open VSX token is stored anywhere.
# Marketplace: the secret VSCE_PAT, which reaches only its own publish step; the step is
# skipped while it is not set, so a tag never fails on a missing token.
# Note: Azure DevOps stops accepting all-organization PATs on 2026-12-01; switch the
# Marketplace step to `vsce publish --azure-credential` (Microsoft Entra workload identity)
# before then. Until a token exists, upload the .vsix artifact at
# https://marketplace.visualstudio.com/manage/publishers/empiriolabs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package --out empiriolabs-vscode-chat.vsix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: empiriolabs-vscode-chat-vsix
          path: empiriolabs-vscode-chat.vsix
          if-no-files-found: error

  publishers:
    name: Install the registry publishers
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publishers' lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: publishers

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install them from their lockfile
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          cp publishers/package.json publishers/package-lock.json "$RUNNER_TEMP/publish/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/publish"
          tar -C "$RUNNER_TEMP/publish" -czf "$RUNNER_TEMP/publishers.tgz" node_modules

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-publishers
          path: ${{ runner.temp }}/publishers.tgz
          if-no-files-found: error

  publish:
    name: Publish to the registries
    needs: [build, publishers]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # The OIDC ID token Open VSX exchanges for a short-lived publishing token.
      id-token: write
    env:
      # Whether the token is set, never the token itself.
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download the publishers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-publishers
          path: ${{ runner.temp }}/publishers

      - name: Unpack the publishers
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          tar -C "$RUNNER_TEMP/publish" -xzf "$RUNNER_TEMP/publishers/publishers.tgz"
          echo "$RUNNER_TEMP/publish/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: empiriolabs-vscode-chat-vsix
          path: ${{ runner.temp }}/vsix

      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.HAS_VSCE_PAT == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: vsce publish --packagePath "$RUNNER_TEMP/vsix/empiriolabs-vscode-chat.vsix" --skip-duplicate

      - name: Publish to Open VSX (trusted publishing)
        run: ovsx publish "$RUNNER_TEMP/vsix/empiriolabs-vscode-chat.vsix" --trusted-publishing --skip-duplicate
