name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Package
        run: npx vsce package --out empiriolabs-vscode-chat.vsix

      # The registry publishers release.yml installs, from the same lockfile and the same
      # way, so a change to publishers/ is tested before it reaches a release.
      - name: Install the registry publishers from their lockfile
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          cp publishers/package.json publishers/package-lock.json "$RUNNER_TEMP/publish/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/publish"
          "$RUNNER_TEMP/publish/node_modules/.bin/vsce" --version
          "$RUNNER_TEMP/publish/node_modules/.bin/ovsx" --version
